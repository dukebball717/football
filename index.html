<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7th Annual Race Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,700;1,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0b0d10;
    --surface:#151a22;
    --surface-2:#1b212b;
    --hairline:#2c3340;
    --caution:#f5c518;
    --chrome:#e7eaee;
    --chrome-dim:#93a0ad;
    --chevy:#f5b400;
    --ford:#2f8fd6;
    --toyota:#e33b3b;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}

  body{
    background:radial-gradient(ellipse at top, #171d26 0%, var(--asphalt) 60%);
    color:var(--chrome);
    font-family:'Inter', sans-serif;
  }

  .page{
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    padding:3.2vh 1.4vw 1.2vh;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2vw;
    flex:0 0 auto;
    margin-bottom:1.2vh;
  }

  .logo-slot{
    flex:0 0 auto;
    height:9vh;
    width:16vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-slot img{ max-height:100%; max-width:100%; object-fit:contain; }
  .logo-fallback{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:1.35vh;
    color:var(--chrome-dim);
    border:1px dashed var(--hairline);
    border-radius:4px;
    padding:1vh 1vw;
    text-align:center;
    line-height:1.3;
  }

  h1{
    flex:1;
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:5.4vh;
    margin:0;
    color:#fff;
    text-shadow:0 0 3vh rgba(245,197,24,.18);
  }
  h1 span{ color:var(--caution); }

  /* ---------- CHECKERED STRIPS ---------- */
  .checker-strip{
    flex:0 0 auto;
    height:1vh;
    background-image:
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);
    background-color:#eee;
    background-size:1.6vh 1.6vh;
    background-position:0 0, .8vh .8vh;
    margin-bottom:1.2vh;
    border-radius:2px;
  }

  /* ---------- BOARD ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:1vh 0.8vw;
  }

  .pool{
    min-height:0;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .pool-head{
    flex:0 0 auto;
    background:var(--surface-2);
    border-bottom:2px solid var(--caution);
    padding:.8vh .8vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.5vw;
  }

  .pool-name{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:3.1vh;
    color:#fff;
    line-height:1.05;
  }

  .flag-badge{
    display:flex;
    align-items:center;
    gap:.35vw;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:1.9vh;
    color:var(--caution);
    flex:0 0 auto;
  }

  .flag-icon{
    width:2.4vh;
    height:1.7vh;
    flex:0 0 auto;
    border:1px solid #000;
    border-radius:1px;
    background-image:
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);
    background-color:#fff;
    background-size:.85vh .85vh;
    background-position:0 0, .425vh .425vh;
  }

  .drivers{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-rows:repeat(3, 1fr);
  }

  .driver{
    display:flex;
    align-items:center;
    gap:.7vw;
    padding:0 .8vw;
    border-top:1px solid var(--hairline);
  }

  .roundel{
    flex:0 0 auto;
    width:5.4vh;
    height:5.4vh;
    border-radius:50%;
    background:#fff;
    border:.5vh solid var(--num-color, var(--chrome-dim));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-style:italic;
    font-size:2.5vh;
    color:#111;
  }

  .driver-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:2.9vh;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <div class="logo-slot" id="logo-nascar">
      <div class="logo-fallback">NASCAR<br>logo</div>
    </div>

    <h1>7<span>th</span> Annual Race Party</h1>

    <div class="logo-slot" id="logo-event">
      <div class="logo-fallback">Coke Zero Sugar 400<br>logo</div>
    </div>
  </div>

  <div class="checker-strip"></div>

  <main id="board"></main>

</div>

<script>
// ---- DATA -------------------------------------------------------
// short = last-name label shown on the board (Shane van Gisbergen -> SVG)
const pools = [
  { owner:"Pam", flags:4, drivers:[
    {num:23, short:"Wallace", mfg:"toyota"},
    {num:54, short:"Gibbs", mfg:"toyota"},
    {num:2,  short:"Cindric", mfg:"ford"},
  ]},
  { owner:"Ron", flags:4, drivers:[
    {num:5,  short:"Larson", mfg:"chevy"},
    {num:88, short:"Zilisch", mfg:"chevy"},
    {num:71, short:"McDowell", mfg:"chevy"},
  ]},
  { owner:"Scott", flags:4, drivers:[
    {num:12, short:"Blaney", mfg:"ford"},
    {num:17, short:"Buescher", mfg:"ford"},
    {num:60, short:"Preece", mfg:"ford"},
  ]},
  { owner:"Nick", flags:4, drivers:[
    {num:45, short:"Reddick", mfg:"toyota"},
    {num:6,  short:"Keselowski", mfg:"ford"},
    {num:4,  short:"Gragson", mfg:"ford"},
  ]},
  { owner:"Zach", flags:3, drivers:[
    {num:9,  short:"Elliott", mfg:"chevy"},
    {num:77, short:"Hocevar", mfg:"chevy"},
    {num:67, short:"Heim", mfg:"toyota"},
  ]},
  { owner:"Ace", flags:2, drivers:[
    {num:11, short:"Hamlin", mfg:"toyota"},
    {num:48, short:"Bowman", mfg:"chevy"},
    {num:43, short:"Jones", mfg:"toyota"},
  ]},
  { owner:"Nicole", flags:2, drivers:[
    {num:24, short:"Byron", mfg:"chevy"},
    {num:1,  short:"Chastain", mfg:"chevy"},
    {num:7,  short:"Suárez", mfg:"chevy"},
  ]},
  { owner:"Daniel", flags:1, drivers:[
    {num:19, short:"Briscoe", mfg:"toyota"},
    {num:3,  short:"Dillon", mfg:"chevy"},
    {num:38, short:"Smith", mfg:"ford"},
  ]},
  { owner:"KO3", flags:1, drivers:[
    {num:22, short:"Logano", mfg:"ford"},
    {num:97, short:"SVG", mfg:"chevy"},
    {num:34, short:"Gilliland", mfg:"ford"},
  ]},
  { owner:"Brenda", flags:0, drivers:[
    {num:20, short:"Bell", mfg:"toyota"},
    {num:47, short:"Stenhouse", mfg:"chevy"},
    {num:21, short:"Berry", mfg:"ford"},
  ]},
];

const mfgColor = { chevy:"var(--chevy)", ford:"var(--ford)", toyota:"var(--toyota)" };

function flagIconHTML(){
  return `<span class="flag-icon"></span>`;
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = pools.map(pool => `
    <section class="pool">
      <div class="pool-head">
        <div class="pool-name">${pool.owner}</div>
        ${pool.flags > 0 ? `<div class="flag-badge">${flagIconHTML()}&times;${pool.flags}</div>` : ""}
      </div>
      <div class="drivers">
        ${pool.drivers.map(d => `
          <div class="driver">
            <div class="roundel" style="--num-color:${mfgColor[d.mfg]}">${d.num}</div>
            <div class="driver-name">${d.short}</div>
          </div>
        `).join("")}
      </div>
    </section>
  `).join("");
}

render();

// ---- LOGO LOADING -------------------------------------------------
// Drop your own image files alongside index.html (e.g. in a /logos folder)
// and update the paths below. If a file isn't found, the text fallback
// already in the HTML stays visible automatically.
function tryLogo(slotId, path){
  const slot = document.getElementById(slotId);
  const img = new Image();
  img.onload = () => { slot.innerHTML = ""; slot.appendChild(img); };
  img.onerror = () => {}; // keep fallback text
  img.src = path;
}
tryLogo("logo-nascar", "logos/nascar-logo.png");
tryLogo("logo-event", "logos/coke-zero-sugar-400-logo.png");
</script>

</body>
</html>
